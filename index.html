<script type="module">

/* ================= UTILS ================= */
const $=s=>document.querySelector(s);
const LOGO='https://i.postimg.cc/tT3Myvhj/ISHURI-Online-Learning-Logo.png';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function busy(b,fn){const l=b.textContent;b.disabled=true;b.textContent='Please wait…';try{await fn()}catch(e){console.error(e);toast(e.code==='permission-denied'?'Permission denied.':'Something went wrong. Please retry.',1)}finally{b.disabled=false;b.textContent=l}}

/* ================= CATALOGUE DATA ================= */
const CATS={
 digital:{n:'Digital Foundations',i:'💻',d:'Build confident everyday computer and internet skills for study, work and daily life.',o:['Use devices and the internet with confidence','Organise and protect your digital work','Apply the skills to a real school or work task'],t:['Computer Basics','Digital Literacy','Internet Essentials','Email Essentials','Online Safety','File Management','Digital Communication']},
 office:{n:'Microsoft Office',i:'📊',d:'Produce professional documents, spreadsheets and presentations with Microsoft Office.',o:['Create and format professional files','Use tools and formulas that save time','Prepare reports, budgets or slides for real use'],t:['Microsoft Word Beginner','Advanced Word','Excel Beginner','Advanced Excel','PowerPoint','Microsoft Access','Office Productivity']},
 google:{n:'Google Workspace',i:'☁️',d:'Collaborate and teach online with free Google tools that work well on mobile data.',o:['Create and share files in the cloud','Collaborate with classmates or colleagues','Collect and organise responses and records'],t:['Google Docs','Google Sheets','Google Slides','Google Forms','Google Drive','Google Classroom','Google Workspace for Teachers']},
 code:{n:'Programming & Web Development',i:'🧑‍💻',d:'Learn to build for the web step by step, from first page to working project.',o:['Write and read basic code','Build and test small web pages or scripts','Publish and share your work'],t:['HTML Foundations','CSS Fundamentals','JavaScript Essentials','Responsive Web Design','Git and GitHub','Firebase Fundamentals','Introduction to Python','Web Development Projects']},
 ai:{n:'Artificial Intelligence',i:'🤖',d:'Understand and use AI tools responsibly in everyday work, teaching and small business.',o:['Explain what AI can and cannot do','Write clear prompts and check the results','Use AI tools safely and responsibly'],t:['Introduction to AI','AI for Everyday Work','AI for Teachers','Responsible AI','Prompt Engineering','AI Productivity Tools','AI for Small Businesses']},
 biz:{n:'Business & Entrepreneurship',i:'🚀',d:'Start, run and lead a small business or team with practical, local examples.',o:['Plan and organise a business idea','Serve customers and communicate clearly','Manage people, time and projects'],t:['Entrepreneurship Fundamentals','Business Planning','Small Business Management','Customer Service','Business Communication','Project Management','Leadership Skills']},
 fin:{n:'Finance & Accounting',i:'💰',d:'Manage money, records and data for yourself or a small enterprise.',o:['Track income and spending accurately','Read and prepare basic financial records','Use data to support decisions'],t:['Personal Finance','Financial Literacy','Bookkeeping','Accounting Fundamentals','Budgeting','Introduction to Power BI','Business Data Analysis']},
 mkt:{n:'Marketing & Communication',i:'📣',d:'Reach customers and tell your story with modern, low-cost marketing tools.',o:['Plan a simple marketing message','Create content for social channels','Measure what works and improve it'],t:['Digital Marketing','Social Media Management','Content Creation','Canva Design','Branding Fundamentals','Professional Communication','Network Marketing Fundamentals']},
 edu:{n:'Education & Teaching',i:'🎓',d:'Teach well in classrooms and online with practical planning and assessment skills.',o:['Plan clear, achievable lessons','Engage and assess learners fairly','Use technology to support every learner'],t:['Digital Teaching Skills','Lesson Planning','Educational Technology','Classroom Management','Online Teaching','Assessment Design','Inclusive Education']},
 career:{n:'Career & Personal Development',i:'🌱',d:'Present yourself well, find opportunities and grow the habits employers value.',o:['Present your skills clearly in writing and speech','Plan your time and job search','Work well with others'],t:['Professional CV Writing','Interview Preparation','Job Search Skills','Public Speaking','Time Management','Critical Thinking','Workplace Collaboration']},
 health:{n:'Health & Community',i:'🩺',d:'Awareness-level skills for safer, healthier communities. Not a substitute for professional training.',o:['Recognise common risks and responses','Share reliable information with others','Act responsibly in your community'],t:['First Aid Awareness','Community Health Education','Environmental Awareness','Digital Citizenship']}
};
const slug=t=>t.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const COURSES=Object.entries(CATS).flatMap(([k,c])=>c.t.map(t=>{let h=0;for(const ch of t)h+=ch.charCodeAt(0);const m=4+h%5;
 return{slug:slug(t),title:t,cat:k,level:/Advanced/.test(t)?'Advanced':/Beginner|Basics|Essentials|Foundations|Introduction|Fundamentals|Awareness/.test(t)?'Beginner':'Intermediate',desc:c.d,mods:m,mins:m*45,outcomes:c.o,price:1000,status:'published',feat:h%7===0,lang:'English',inst:'To be announced'}}));
const BY=Object.fromEntries(COURSES.map(c=>[c.slug,c]));
const hue=k=>Object.keys(CATS).indexOf(k)*28+190;

/* Original sample lessons (only these courses have full content; all others are Coming Soon) */
const LESSONS={
'computer-basics':{lessons:[
 {t:'What is a computer? (Free introduction)',o:'Name the main parts of a computer and what they do',b:['A computer takes in information (input), works on it (processing), stores it, and shows a result (output). A keyboard or touchscreen is input. A screen or speaker is output.','Your smartphone is a computer too. A shop owner who records sales on a phone and checks a mobile money balance is using input, processing, storage and output in a few seconds.']},
 {t:'Hardware and software',o:'Tell hardware from software and give examples',b:['Hardware is anything you can touch: the screen, battery, keyboard and charger. Software is the instructions that run on it: the operating system, a browser, a calculator app.','Without software, hardware does nothing useful. Without hardware, software has nowhere to run. Both must work together.']},
 {t:'Keeping your device healthy',o:'List three habits that protect your device and data',b:['Charge with a good cable, keep the device away from water and heat, and restart it regularly so updates can finish.','Back up important files such as certificates and CVs to cloud storage or a second device. A lost phone should never mean lost work.']}],
 quiz:[{q:'Which of these is an INPUT device?',c:['Speaker','Keyboard','Screen'],a:1,e:'A keyboard sends information into the computer. Speakers and screens show results.'},{q:'A browser such as Chrome is an example of:',c:['Hardware','Software','A charger'],a:1,e:'A browser is a program, so it is software.'},{q:'What is the best protection against losing important files?',c:['Back them up','Delete them','Never restart'],a:0,e:'A backup in a second place means one failure does not erase your work.'}]},
'online-safety':{lessons:[
 {t:'Strong passwords (Free introduction)',o:'Create a password that is hard to guess but easy to remember',b:['Long beats complicated. A phrase of four or five unrelated words is stronger than a short word with a number added. Use a different password for each important account, especially email and mobile money.','Never share a PIN or one-time code, even with someone claiming to be from a bank or network operator. Real providers do not ask for them.']},
 {t:'Spotting scams and phishing',o:'Recognise warning signs in messages and links',b:['Scam messages create urgency: win a prize, account blocked, send a fee now. Check the sender, look for spelling mistakes, and do not tap links you did not expect.','If unsure, contact the company using a number from its official website, not the number in the message.']}],
 quiz:[{q:'Which password is strongest?',c:['ishuri123','Rain-Mango-Bridge-Seven','password'],a:1,e:'Long, unrelated words are hard to guess.'},{q:'Someone asks for your one-time code by SMS. You should:',c:['Send it quickly','Never share it','Ask a friend to send'],a:1,e:'One-time codes prove it is you. Sharing them lets others take over your account.'},{q:'A message says "Your account is blocked, pay a fee now". Best action?',c:['Pay immediately','Contact the company using its official number','Forward it to everyone'],a:1,e:'Urgency is a scam signal; verify through an official channel.'}]}
};

/* ================= FIREBASE ================= */
const app=initializeApp({apiKey:"AIzaSyAlecssz7iDdq_h4IhVo1HKlj-MpRa3CCs",authDomain:"ishuri-online.firebaseapp.com",projectId:"ishuri-online",storageBucket:"ishuri-online.firebasestorage.app",messagingSenderId:"910778726579",appId:"1:910778726579:web:2c49c3882dcc04a48cd8c6",measurementId:"G-9S3SSG6JS3"});
const auth=getAuth(app),db=getFirestore(app);
const ST={user:null,enr:{},ents:new Set(),att:[],ready:false};

async function loadOverrides(){try{(await getDocs(collection(db,'courses'))).forEach(d=>{const c=BY[d.id],x=d.data();if(c){if(Number.isFinite(x.price))c.price=x.price;if(['published','unpublished','archived'].includes(x.status))c.status=x.status}})}catch(e){console.warn('Course settings unavailable',e)}}
async function loadUser(){
 ST.enr={};ST.ents=new Set();ST.att=[];if(!ST.user)return;
 const q=c=>getDocs(query(collection(db,c),where('uid','==',ST.user.uid)));
 const [e,t,a]=await Promise.all([q('enrollments'),q('entitlements'),q('quizAttempts')]);
 e.forEach(d=>ST.enr[d.data().slug]=d.data());
 t.forEach(d=>{if(d.data().status==='verified')ST.ents.add(d.data().slug)});
 ST.att=a.docs.map(d=>d.data());
}
async function ensureProfile(u){const r=doc(db,'users',u.uid);if(!(await getDoc(r)).exists())await setDoc(r,{displayName:u.displayName||'',email:u.email||'',photoURL:u.photoURL||'',lang:'en',createdAt:serverTimestamp()})}
const signIn=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>{if(e.code!=='auth/popup-closed-by-user')toast(e.code==='auth/unauthorized-domain'?'This domain is not authorised in Firebase Auth.':'Sign-in failed. Please retry.',1)});
onAuthStateChanged(auth,async u=>{
 ST.user=u;
 try{if(u){await ensureProfile(u);await loadUser()}else{ST.enr={};ST.ents=new Set();ST.att=[]}}catch(e){console.error(e);toast('Could not load your account data.',1)}
 ST.ready=true;renderAuth();route();
});
function renderAuth(){const a=$('#auth');a.innerHTML=ST.user?`<button class="btn sm" data-act="signout" aria-label="Sign out"><img src="${esc(ST.user.photoURL||LOGO)}" alt="" width="22" height="22" referrerpolicy="no-referrer" style="border-radius:50%;object-fit:contain" onerror="this.src='${LOGO}'">${esc((ST.user.displayName||'Student').split(' ')[0])} · Sign out</button>`:`<button class="btn sm p" data-act="signin">Sign in with Google</button>`}

/* ================= VIEWS ================= */
/* Course artwork: SVG composition per category (hexagons, networks, waves), no external images */
function art(c){
 const k=Object.keys(CATS).indexOf(c.cat),h=hue(c.cat);let s=7;for(const ch of c.slug)s=(s*31+ch.charCodeAt(0))%9973;
 const r=i=>((s*(i+3)*2654435761)>>>0)%1000/1000;let g='';
 if(k%3===0){for(let i=0;i<5;i++){const x=30+r(i)*240,y=15+r(i+9)*66,z=10+r(i+4)*18,pt=[0,1,2,3,4,5].map(a=>(x+z*Math.cos(a*1.047)).toFixed(1)+','+(y+z*Math.sin(a*1.047)).toFixed(1)).join(' ');g+=`<polygon points="${pt}" fill="none" stroke="hsl(${h} 90% 75%)" stroke-opacity=".7"/>`}}
 else if(k%3===1){const p=[0,1,2,3,4,5].map(i=>[20+r(i)*260,12+r(i+7)*70]);p.forEach((a,i)=>{const b=p[(i+1)%6];g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="hsl(${h} 90% 70%)" stroke-opacity=".4"/>`});p.forEach(a=>{g+=`<circle cx="${a[0]}" cy="${a[1]}" r="3" fill="hsl(${h} 95% 80%)"/>`})}
 else{for(let i=0;i<4;i++){const y=20+i*16,a=6+r(i)*10;g+=`<path d="M0 ${y} Q 75 ${y-a} 150 ${y} T 300 ${y}" fill="none" stroke="hsl(${h} 90% 72%)" stroke-opacity="${(.7-i*.12).toFixed(2)}"/>`}}

 if(a==='enroll')return busy(b,async()=>{const r=doc(db,'enrollments',ST.user.uid+'_'+s);if((await getDoc(r)).exists()){toast('You are already enrolled.');await loadUser();return route()}
  await setDoc(r,{uid:ST.user.uid,slug:s,completed:[],last:0,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});await logActivity('course_started',s);await loadUser();toast('Enrolled.');route()});
 if(a==='complete')return busy(b,async()=>{const i=+b.dataset.i,r=doc(db,'enrollments',ST.user.uid+'_'+s),ex=ST.enr[s];
  await setDoc(r,{uid:ST.user.uid,slug:s,last:i,completed:arrayUnion('l'+i),updatedAt:serverTimestamp(),...(ex?{}:{createdAt:serverTimestamp()})},{merge:true});
  await logActivity('lesson_completed',s,{lessonIndex:i});await loadUser();toast('Lesson completed.');route()});
 if(a==='savecourse')return busy(b,async()=>{const p=+$('#p-'+s).value,st=$('#s-'+s).value;
  if(st==='archived'&&!confirm('Archive this course? It will be hidden from the catalogue.'))return;
  if(!Number.isInteger(p)||p<0||p>1000000){toast('Price must be a whole number between 0 and 1,000,000.',1);return}
  await setDoc(doc(db,'courses',s),{price:p,status:st,updatedBy:ST.user.uid,updatedAt:serverTimestamp()},{merge:true});BY[s].price=p;BY[s].status=st;toast('Saved.')});
});

/* ================= 3D ATMOSPHERE (condensed from the original scene) ================= */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,mob=/Mobi|Android/i.test(navigator.userAgent);
let lowData=localStorage.getItem('ishuriLow')==='1'||!!navigator.connection?.saveData;
let R,SC,CAM,COMP,SKY,camP,lookP,look,raf=0,scr=0,sm=0,tm=0,hexes=[],rib=[],pts;
const clock=new THREE.Clock(),bg=$('#bg');
/* Camera progress is mapped per view: the landing page travels the full path; other views use a short calm segment so route changes never cause a jump. */
let camMin=0,camMax=1;
function updScroll(){const d=document.documentElement.scrollHeight-innerHeight,raw=d>0?Math.min(1,Math.max(0,scrollY/d)):0;scr=camMin+(camMax-camMin)*raw}
addEventListener('scroll',updScroll,{passive:true});
function stop3d(){cancelAnimationFrame(raf);raf=0;if(R){R.dispose();R.domElement.remove();R=null}COMP=null;FX=null;hexes=[];rib=[];nodes=[];dots=[];arcs=[]}
function toggleLow(){lowData=!lowData;localStorage.setItem('ishuriLow',lowData?'1':'0');syncLow();lowData?stop3d():start3d();toast(lowData?'Low-data mode on: 3D background off.':'3D background on.')}
function syncLow(){const b=$('#ldBtn');b.setAttribute('aria-pressed',lowData);b.textContent='Low-data mode: '+(lowData?'on':'off')}
/* ---- Approved atmosphere, restored from the original file: sky shader + clouds, rolling ground, hex panels,
   communication nodes + edges, wave ribbons, data-dot clusters, tech arcs, bloom, FXAA, cinematic camera path ---- */
let FX,nodes=[],dots=[],arcs=[],edgeMat,reveal=0;
const PAL={top:0x0a1a4a,mid:0x1a3a7a,horizon:0x2a5a9a,deep:0x050e2a,hex:new THREE.Color(0x4ab8ff),hexDim:new THREE.Color(0x2a70b8),node:new THREE.Color(0x9ae0ff),wave:new THREE.Color(0x5ac0ff),dot:new THREE.Color(0x6ac8ff)};
const Q=mob?{hex:14,node:55,rib:3,dots:5,arcs:4,edges:40}:{hex:22,node:90,rib:4,dots:8,arcs:6,edges:70};
const ADD={transparent:true,blending:THREE.AdditiveBlending,depthWrite:false};

function start3d(){
 if(lowData||R)return;
 try{
  const probe=document.createElement('canvas');
  if(!(probe.getContext('webgl2')||probe.getContext('webgl')))throw new Error('WebGL unavailable');
  SC=new THREE.Scene();SC.fog=new THREE.Fog(0x0a1a3a,70,420);
  CAM=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,2000);CAM.position.set(0,12,60);
  R=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
  R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,mob?1.5:2));
  R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.15;R.outputColorSpace=THREE.SRGBColorSpace;
  bg.appendChild(R.domElement);
  R.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();cancelAnimationFrame(raf);raf=0;toast('3D background paused. Lessons still work.')});
  R.domElement.addEventListener('webglcontextrestored',()=>{stop3d();start3d()});
  COMP=new EffectComposer(R);COMP.addPass(new RenderPass(SC,CAM));
  COMP.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.55,.75,.75));
  FX=new ShaderPass(FXAAShader);
  FX.uniforms.resolution.value.set(1/(innerWidth*R.getPixelRatio()),1/(innerHeight*R.getPixelRatio()));
  COMP.addPass(FX);
  buildSky();buildGround();buildHexes();buildNetwork();buildRibbons();buildDots();buildArcs();buildCamera();
  look=new THREE.Vector3(0,20,0);reveal=0;loop();
 }catch(e){console.warn('3D unavailable',e);stop3d()}
}

function buildSky(){
 SKY=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
  uniforms:{uTime:{value:0},uTop:{value:new THREE.Color(PAL.top)},uMid:{value:new THREE.Color(PAL.mid)},uHorizon:{value:new THREE.Color(PAL.horizon)},uDeep:{value:new THREE.Color(PAL.deep)},uGlow:{value:new THREE.Color(0x2a70c8)}},
  vertexShader:`varying vec3 vDir;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vDir=normalize(wp.xyz);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
   uniform float uTime;uniform vec3 uTop,uMid,uHorizon,uDeep,uGlow;varying vec3 vDir;
   float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
   float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);float a=hash(i),b=hash(i+vec2(1.0,0.0)),c=hash(i+vec2(0.0,1.0)),d=hash(i+vec2(1.0,1.0));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
   float fbm(vec2 p){float v=0.0,a=0.5;for(int i=0;i<5;i++){v+=a*noise(p);p*=2.03;a*=0.5;}return v;}
   void main(){
    vec3 dir=normalize(vDir);float h=clamp(dir.y*0.5+0.5,0.0,1.0);
    vec3 col=mix(uDeep,uHorizon,smoothstep(0.32,0.55,h));
    col=mix(col,uMid,smoothstep(0.55,0.78,h));col=mix(col,uTop,smoothstep(0.78,1.0,h));
    float centerGlow=pow(1.0-abs(dir.x),3.0)*pow(1.0-abs(dir.y),12.0);col+=uGlow*centerGlow*0.7;
    if(dir.y>0.01){
     float alt=1.0/max(dir.y,0.008);vec2 uv=dir.xz*alt*0.10+vec2(uTime*0.004,uTime*0.0025);
     float clouds=smoothstep(0.52,0.78,fbm(uv));
     float fade=smoothstep(0.01,0.20,dir.y)*(1.0-smoothstep(0.70,1.0,dir.y));
     col=mix(col,col*1.35+vec3(0.10,0.20,0.35),clouds*0.35*fade);
    }
    float v=smoothstep(0.0,1.0,1.0-length(dir.xz)*0.5);col*=0.85+v*0.15;gl_FragColor=vec4(col,1.0);
   }`});
 SC.add(new THREE.Mesh(new THREE.SphereGeometry(900,64,48),SKY));
}

function buildGround(){
 const geo=new THREE.PlaneGeometry(3000,3000,80,80),pos=geo.attributes.position.array,colors=new Float32Array(pos.length);
 const cDeep=new THREE.Color(0x050e28),cNear=new THREE.Color(0x0a1a3a),cHorizon=new THREE.Color(0x1a3a6a);
 for(let i=0;i<pos.length;i+=3){
  const x=pos[i],z=pos[i+2],dist=Math.hypot(x,z);
  pos[i+1]=Math.sin(x*.008)*1.6+Math.cos(z*.010)*1.6+Math.sin(x*.03+1.3)*.4+Math.cos(z*.026+.7)*.4;
  const c=cNear.clone(),fade=Math.min(1,Math.max(0,(dist-100)/500));
  c.lerp(cHorizon,fade*.8);c.lerp(cDeep,Math.max(0,1-dist/200)*.4);
  colors[i]=c.r;colors[i+1]=c.g;colors[i+2]=c.b;
 }
 geo.setAttribute('color',new THREE.BufferAttribute(colors,3));geo.computeVertexNormals();
 const ground=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.85,metalness:.35,emissive:new THREE.Color(0x0a1a3a),emissiveIntensity:.4}));
 ground.rotation.x=-Math.PI/2;ground.position.y=-2;SC.add(ground);
 SC.add(new THREE.HemisphereLight(0x4a80c8,0x0a1028,.8),new THREE.AmbientLight(0x3060a0,.4));
 const rim=new THREE.DirectionalLight(0x5aa8ff,.9);rim.position.set(0,3,-60);
 const fill=new THREE.DirectionalLight(0x8ac8ff,.5);fill.position.set(20,40,20);SC.add(rim,fill);
}

function buildHexes(){
 const ringGeo=new THREE.RingGeometry(1.4,1.55,6),fillGeo=new THREE.CircleGeometry(1.4,6);
 for(let i=0;i<Q.hex;i++){
  const group=new THREE.Group();
  const ringMat=new THREE.MeshBasicMaterial({color:PAL.hex,opacity:.75,side:THREE.DoubleSide,...ADD});
  const fillMat=new THREE.MeshBasicMaterial({color:PAL.hexDim,opacity:.16,side:THREE.DoubleSide,...ADD});
  const fill=new THREE.Mesh(fillGeo,fillMat);fill.position.z=-.001;
  group.add(new THREE.Mesh(ringGeo,ringMat),fill);
  const a=Math.random()*Math.PI*2,r=35+Math.random()*85,h=3+Math.random()*55;
  group.position.set(Math.cos(a)*r,h,Math.sin(a)*r);group.lookAt(0,h,0);group.rotateZ(Math.random()*Math.PI*2);
  group.scale.setScalar(.7+Math.random()*1.4);
  group.userData={base:.45+Math.random()*.4,phase:Math.random()*Math.PI*2,spin:(Math.random()-.5)*.15,drift:Math.random()*Math.PI*2,y:h};
  SC.add(group);hexes.push({group,ringMat,fillMat});
 }
}

function buildNetwork(){
 const P=[];
 for(let i=0;i<Q.node;i++){const a=Math.random()*Math.PI*2,r=20+Math.random()*90;P.push(new THREE.Vector3(Math.cos(a)*r,5+Math.random()*45,Math.sin(a)*r))}
 const nodeGeo=new THREE.SphereGeometry(.18,8,8);
 P.forEach(p=>{
  const n=new THREE.Mesh(nodeGeo,new THREE.MeshBasicMaterial({color:PAL.node,opacity:.95,...ADD}));
  n.position.copy(p);n.userData={phase:Math.random()*Math.PI*2,scale:.8+Math.random()*.7};n.scale.setScalar(n.userData.scale);
  SC.add(n);nodes.push(n);
 });
 const pairs=[];
 for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=P[i].distanceTo(P[j]);if(d<32&&Math.random()<.35)pairs.push([i,j,d])}
 pairs.sort((a,b)=>a[2]-b[2]);
 const chosen=pairs.slice(0,Q.edges),arr=new Float32Array(chosen.length*6);
 chosen.forEach(([i,j],k)=>{arr.set([P[i].x,P[i].y,P[i].z,P[j].x,P[j].y,P[j].z],k*6)});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));
 edgeMat=new THREE.LineBasicMaterial({color:PAL.hex,opacity:.18,...ADD});
 SC.add(new THREE.LineSegments(g,edgeMat));
}

function buildRibbons(){
 const seg=200,width=.4;
 for(let w=0;w<Q.rib;w++){
  const verts=new Float32Array(seg*6),uvs=new Float32Array(seg*4),idx=[];
  for(let i=0;i<seg;i++){
   const t=i/(seg-1),x=(t-.5)*260,y=Math.sin(t*Math.PI*3+w*1.7)*3.5+Math.sin(t*Math.PI*7+w*2.3)*1.2,z=-30-w*15+Math.sin(t*Math.PI*5+w)*4;
   verts.set([x,y+width,z,x,y-width,z],i*6);uvs.set([t,0,t,1],i*4);
   if(i<seg-1){const a=i*2,b=a+1,c=a+2,d=a+3;idx.push(a,b,c,b,d,c)}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(verts,3));g.setAttribute('uv',new THREE.BufferAttribute(uvs,2));g.setIndex(idx);
  const mat=new THREE.ShaderMaterial({side:THREE.DoubleSide,...ADD,
   uniforms:{uTime:{value:0},uColor:{value:PAL.wave},uOffset:{value:Math.random()*10},uOpacity:{value:.4+Math.random()*.35}},
   vertexShader:`uniform float uTime,uOffset;varying vec2 vUv;void main(){vUv=uv;vec3 p=position;p.y+=sin(p.x*.08+uTime*.6+uOffset)*.8;p.y+=cos(p.x*.2+uTime*.9+uOffset*2.)*.3;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
   fragmentShader:`uniform float uTime,uOpacity;uniform vec3 uColor;varying vec2 vUv;void main(){float edge=smoothstep(0.,.45,vUv.y)*smoothstep(1.,.55,vUv.y);float fade=smoothstep(0.,.12,vUv.x)*smoothstep(1.,.88,vUv.x);float pulses=0.;for(int i=0;i<3;i++){float p=fract(vUv.x*2.-uTime*.12+float(i)*.33);pulses+=smoothstep(.04,0.,abs(p-.5))*.5;}float base=.35;vec3 col=mix(uColor*(base+pulses),vec3(.85,.95,1.),pulses*.6);gl_FragColor=vec4(col,(base+pulses)*edge*fade*uOpacity);}`});
  const m=new THREE.Mesh(g,mat);m.position.set(0,12+w*4,-10+w*5);SC.add(m);rib.push(mat);
 }
}

function buildDots(){
 const geo=new THREE.SphereGeometry(.14,6,6);
 for(let c=0;c<Q.dots;c++){
  const o=new THREE.Vector3((Math.random()-.5)*120,8+Math.random()*40,-20-Math.random()*40),P=[];
  for(let i=0;i<8;i++)for(let j=0;j<5;j++){if(Math.random()<.35)continue;P.push(new THREE.Vector3(o.x+i*1.2,o.y+j*1.2,o.z+(Math.random()-.5)*.5))}
  const mesh=new THREE.InstancedMesh(geo,new THREE.MeshBasicMaterial({color:PAL.dot,opacity:.9,...ADD}),P.length),d=new THREE.Object3D();
  P.forEach((p,i)=>{d.position.copy(p);d.updateMatrix();mesh.setMatrixAt(i,d.matrix)});
  mesh.instanceMatrix.needsUpdate=true;SC.add(mesh);dots.push({mesh,phase:Math.random()*Math.PI*2,base:.6+Math.random()*.35});
 }
}

function buildArcs(){
 const proto=new THREE.ShaderMaterial({side:THREE.DoubleSide,...ADD,uniforms:{uTime:{value:0},uColor:{value:PAL.hex}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform float uTime;uniform vec3 uColor;varying vec2 vUv;void main(){float fade=smoothstep(0.,.15,vUv.x)*smoothstep(1.,.85,vUv.x);float core=smoothstep(.5,0.,abs(vUv.y-.5)*2.);float p=fract(vUv.x*1.5-uTime*.12);float glow=smoothstep(.06,0.,abs(p-.5));gl_FragColor=vec4(uColor*(.6+glow*.9),(core*.5+glow*.8)*fade);}`});
 for(let i=0;i<Q.arcs;i++){
  const a=i/Q.arcs*Math.PI*2+Math.random()*.4,radius=130+Math.random()*60,alt=35+Math.random()*35,span=Math.PI*(.3+Math.random()*.35),pts=[];
  for(let s=0;s<=40;s++){const t=s/40,ang=a-span/2+span*t;pts.push(new THREE.Vector3(Math.cos(ang)*radius,Math.sin(t*Math.PI)*alt*.4+alt*.6,Math.sin(ang)*radius))}
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),64,.5,6,false),proto.clone());
  SC.add(mesh);arcs.push(mesh);
 }
}

function buildCamera(){
 camP=new THREE.CatmullRomCurve3([[0,10,70],[8,12,55],[14,16,44],[10,24,36],[2,34,32],[-8,42,30],[-14,52,32],[-10,62,38],[-2,74,46],[8,84,56]].map(v=>new THREE.Vector3(...v)),false,'catmullrom',.5);
 lookP=new THREE.CatmullRomCurve3([20,24,28,34,42,50,56,62,60,55].map(y=>new THREE.Vector3(0,y,0)),false,'catmullrom',.5);
}

function loop(){
 raf=requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),.05);tm+=dt;reveal=Math.min(1,reveal+dt*.35);
 sm+=(scr-sm)*(reduce?1:.075);
 const t=Math.min(1,Math.max(0,sm)),tp=camP.getPointAt(t),tl=lookP.getPointAt(t);
 if(reveal<1&&!reduce){const e=1-Math.pow(1-reveal,3);CAM.position.lerpVectors(camP.getPointAt(0).clone().multiplyScalar(1.3),tp,e)}
 else CAM.position.lerp(tp,reduce?1:.07);
 look.lerp(tl,reduce?1:.06);CAM.lookAt(look);
 if(!reduce){
  SKY.uniforms.uTime.value=tm;
  hexes.forEach(({group:g,ringMat,fillMat})=>{
   const p=.55+Math.sin(tm*1.2+g.userData.phase)*.4;
   ringMat.opacity=g.userData.base*p;fillMat.opacity=.10+p*.14;
   g.rotateZ(g.userData.spin*dt);g.position.y=g.userData.y+Math.sin(tm*.4+g.userData.drift)*1.2;
  });
  nodes.forEach(n=>{const p=.7+Math.sin(tm*1.6+n.userData.phase)*.5;n.scale.setScalar(n.userData.scale*(.85+p*.4));n.material.opacity=.5+p*.5});
  if(edgeMat)edgeMat.opacity=.14+Math.sin(tm*.6)*.06;
  rib.forEach(m=>{m.uniforms.uTime.value=tm});
  dots.forEach(d=>{d.mesh.material.opacity=d.base*(.6+Math.sin(tm+d.phase)*.4)});
  arcs.forEach(m=>{m.material.uniforms.uTime.value=tm});
 }
 COMP.render();
}
addEventListener('resize',()=>{updScroll();if(!R)return;CAM.aspect=innerWidth/innerHeight;CAM.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,mob?1.5:2));COMP.setSize(innerWidth,innerHeight);FX.uniforms.resolution.value.set(1/(innerWidth*R.getPixelRatio()),1/(innerHeight*R.getPixelRatio()))},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else if(R&&!raf){clock.getDelta();loop()}});

syncLow();start3d();loadOverrides().then(()=>{if(ST.ready)route()});
</script>
